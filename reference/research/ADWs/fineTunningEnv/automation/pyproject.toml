[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nb-audit"
version = "0.1.0"
description = "Automated ML notebook audit & repair pipeline"
requires-python = ">=3.13"
dependencies = [
    "nbformat",
    "nbclient",
    "PyYAML",
    "typer",
    "httpx",
]

[project.scripts]
nb-audit = "nb_audit.cli:app"

[tool.setuptools.packages.find]
include = ["nb_audit*"]
